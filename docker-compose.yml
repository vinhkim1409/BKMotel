version: "3.8"

services:
  client:
    image: kimxuanvinh2002/client:latest
    ports:
      - "80:80"
    depends_on:
      - server

  server:
    image: kimxuanvinh2002/server:latest
    expose:
      - "5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/mydb
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    restart: always
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: